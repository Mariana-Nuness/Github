<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade Grid Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    #container {
      display: grid;
      gap: 5px;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: 10vh 40vh 30vh 10vh;
      grid-template-areas:
        "navbar navbar navbar navbar"
        "sidebar main main main"
        "sidebar content1 content2 content3"
        "sidebar footer footer footer";

    }

    body {

      background-color: rgb(245, 245, 245);
    }

    #container div {
      background-color: pink;
      text-align: center;
      color: rgb(255, 255, 255);
    }

    .navbar {
      grid-area: navbar;
    }

    .sidebar {
      grid-area: sidebar;

    }

    .main {
      grid-area: main;
    }

    .content1 {
      grid-area: content1;
    }

    .content2 {
      grid-area: content2;
    }

    .content3 {
      grid-area: content3;
    }

    .footer {
      grid-area: footer;
    }
  </style>
</head>

<body>
  <div id="container">
    <div class="navbar">
      <h2>NAVBAR</h2>
    </div>
    <div class="sidebar">
      <h2>SIDERBAR</h2>
    </div>
    <div class="main">
      <h2>MAIN</h2>
    </div>
    <div class="content1">
      <h2>CONTENT1</h2>
    </div>
    <div class="content2">
      <h2>CONTENT2</h2>
    </div>
    <div class="content3">
      <h2>CONTENT3</h2>
    </div>
    <div class="footer">
      <h2>FOOTER</h2>
    </div>
  </div>
</body>

</html>
